name: Deploy standalone build to GitHub Pages

on:
  push:
    branches:
      - claude/oem-brands-portfolio-site-m5l55d
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone (no-server) site
        working-directory: client
        run: |
          npm install
          npm run build:standalone

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist-standalone
