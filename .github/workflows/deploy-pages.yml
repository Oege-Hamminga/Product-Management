name: Rebuild site for GitHub Pages

# GitHub Pages on this repo is already configured to serve straight from
# this branch's root, so this workflow rebuilds the client and commits the
# result back to the repo root (index.html plus its assets/ folder) — it
# does not push to a separate gh-pages branch. The path filter only watches
# the client app's own source, so this can never trigger itself in a loop,
# and it never touches data/ (the shared app data + images, committed
# directly by the live site itself via the GitHub API — see githubDb.ts)
# so a save made on the live site never gets overwritten by a later deploy.
#
# This builds the GitHub-committed client (see vite.config.github.ts):
# every visitor reads the shared data/ files committed to this same repo,
# and anyone with a GitHub personal access token that can push here can log
# in and edit — no separate account or service to set up, unlike an
# API-server-backed deployment would need.

on:
  push:
    branches:
      - claude/oem-brands-portfolio-site-m5l55d
    paths:
      - "client/src/**"
      - "client/index.html"
      - "client/package.json"
      - "client/package-lock.json"
      - "client/vite.config.github.ts"
      - "client/tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the GitHub-committed client
        working-directory: client
        run: |
          npm install
          npm run build:github

      - name: Publish to repo root
        run: |
          rm -rf assets
          cp -r client/dist-github/assets assets
          cp client/dist-github/index.html index.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish site to GitHub Pages [skip ci]"
            git push
          fi
