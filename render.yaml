# Render Blueprint for the server-backed app (Express + libSQL/Turso) — see
# README.md's "Shared, public deployment" section for the full setup walk-
# through. In the Render dashboard: New > Blueprint > pick this repo, and
# Render reads this file to create the service below. The four env vars
# marked `sync: false` need a real value pasted in by hand afterwards
# (Render prompts for them); JWT_SECRET is generated automatically.
services:
  - type: web
    name: oem-portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
